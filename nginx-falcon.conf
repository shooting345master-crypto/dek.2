# /etc/nginx/sites-available/falcon
# Falcon Fitness — Nginx front door.
# After installing this file:
#   sudo ln -s /etc/nginx/sites-available/falcon /etc/nginx/sites-enabled/falcon
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot to add HTTPS; it will edit this file itself.

server {
    listen 80;
    listen [::]:80;
    server_name fitn.co.in www.fitn.co.in;

    client_max_body_size 12M;   # receipt photos can be large

    access_log /var/log/nginx/falcon.access.log;
    error_log  /var/log/nginx/falcon.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # These four headers are required. Without X-Forwarded-For every
        # visitor appears to come from 127.0.0.1 and the login rate limiter
        # would lock out the whole world after ten failed attempts.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Let Nginx serve the images and CSS directly — faster than Python.
    location /static/ {
        alias /home/falcon/app/falcon-fitness/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
